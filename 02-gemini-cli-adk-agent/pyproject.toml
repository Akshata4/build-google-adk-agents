[project]
name = "gemini-cli-adk-agent"
version = "0.1.0"
description = "ADK pipeline that uses Gemini CLI as a tool for codebase analysis and test generation"
authors = [{ name = "Akshata Madavi", email = "akshatamadavi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=2.13.0",
    "python-dotenv>=1.2.4",
    # The pipeline runs the generated tests with pytest.
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gemini_cli_agent"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
# Cloned repositories in workspace/ have their own test suites; skip them.
testpaths = ["tests"]
filterwarnings = ["ignore:.*(Sequential|Loop)Agent is deprecated:DeprecationWarning"]
