# MCP Toolbox for Databases: ticket tools shared by every environment.
# Combine with an environment overlay that defines the `tickets-db` source and
# the `search-tickets` tool:
#   local:  toolbox --configs tools.yaml,local.yaml
kind: tool
name: get-ticket-by-id
type: postgres-sql
source: tickets-db
description: Retrieve a ticket's details using its unique ID.
parameters:
  - name: ticket_id
    type: integer
    description: The unique ID of the ticket.
statement: SELECT * FROM tickets WHERE ticket_id = $1;
---
kind: tool
name: get-tickets-by-assignee
type: postgres-sql
source: tickets-db
description: Search for tickets based on assignee (email).
parameters:
  - name: assignee
    type: string
    description: The email of the assignee, or part of it.
statement: SELECT * FROM tickets WHERE assignee ILIKE '%' || $1 || '%';
---
kind: tool
name: get-tickets-by-status
type: postgres-sql
source: tickets-db
description: Search for tickets based on their current status.
parameters:
  - name: status
    type: string
    description: The status of the tickets to retrieve (e.g., 'Open', 'In Progress', 'Closed', 'Resolved').
statement: SELECT * FROM tickets WHERE status ILIKE '%' || $1 || '%';
---
kind: tool
name: get-tickets-by-priority
type: postgres-sql
source: tickets-db
description: Search for tickets based on their priority.
parameters:
  - name: priority
    type: string
    description: The priority of the tickets to retrieve (e.g., 'P0 - Critical', 'P1 - High', 'P2 - Medium', 'P3 - Low').
statement: SELECT * FROM tickets WHERE priority ILIKE '%' || $1 || '%';
---
kind: tool
name: get-tickets-by-date-range
type: postgres-sql
source: tickets-db
description: Retrieve tickets created or updated within a date range (both dates inclusive).
parameters:
  - name: start_date
    type: string
    description: The start date (inclusive), formatted 'YYYY-MM-DD'.
  - name: end_date
    type: string
    description: The end date (inclusive), formatted 'YYYY-MM-DD'.
  - name: date_field
    type: string
    description: The date field to filter by ('creation_time' or 'updated_time').
# end_date + 1 day so tickets from anywhere on end_date are included.
statement: |
  SELECT * FROM tickets
  WHERE CASE WHEN $3 = 'creation_time' THEN creation_time ELSE updated_time END
        >= $1::date
    AND CASE WHEN $3 = 'creation_time' THEN creation_time ELSE updated_time END
        < $2::date + 1;
---
kind: tool
name: update-ticket-priority
type: postgres-sql
source: tickets-db
description: Update the priority of a ticket based on its ID.
parameters:
  - name: priority
    type: string
    description: The priority of the ticket. Can be one of 'P0 - Critical', 'P1 - High', 'P2 - Medium', or 'P3 - Low'.
  - name: ticket_id
    type: integer
    description: The ID of the ticket.
statement: UPDATE tickets SET priority = $1 WHERE ticket_id = $2 RETURNING ticket_id, priority;
---
kind: tool
name: update-ticket-status
type: postgres-sql
source: tickets-db
description: Update the status of a ticket based on its ID.
parameters:
  - name: status
    type: string
    description: The new status of the ticket (e.g., 'Open', 'In Progress', 'Closed', 'Resolved').
  - name: ticket_id
    type: integer
    description: The ID of the ticket.
statement: UPDATE tickets SET status = $1 WHERE ticket_id = $2 RETURNING ticket_id, status;
---
kind: tool
name: create-new-ticket
type: postgres-sql
source: tickets-db
description: Create a new software ticket.
parameters:
  - name: title
    type: string
    description: The title of the new ticket.
  - name: description
    type: string
    description: A detailed description of the bug or issue.
  - name: assignee
    type: string
    description: The email of the person to whom the ticket should be assigned.
  - name: priority
    type: string
    description: The priority of the ticket. Can be 'P0 - Critical', 'P1 - High', 'P2 - Medium', or 'P3 - Low'. Use 'P3 - Low' if not specified.
  - name: status
    type: string
    description: The initial status of the ticket. Use 'Open' if not specified.
statement: |
  INSERT INTO tickets (title, description, assignee, priority, status)
  VALUES ($1, $2, $3, COALESCE(NULLIF($4, ''), 'P3 - Low'), COALESCE(NULLIF($5, ''), 'Open'))
  RETURNING ticket_id;
---
kind: toolset
name: tickets_toolset
tools:
  - search-tickets
  - get-ticket-by-id
  - get-tickets-by-assignee
  - get-tickets-by-status
  - get-tickets-by-priority
  - get-tickets-by-date-range
  - update-ticket-priority
  - update-ticket-status
  - create-new-ticket
