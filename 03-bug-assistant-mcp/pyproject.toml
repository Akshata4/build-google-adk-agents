[project]
name = "software-bug-assistant"
version = "0.1.0"
description = "MCP tools based software bug assistant built with Google ADK"
authors = [{ name = "Akshata Madavi", email = "akshatamadavi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[mcp]>=2.13.0",
    "langchain-community>=0.4.2",
    "python-dotenv>=1.2.4",
    "stackapi>=0.3.1",
    "toolbox-core>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["software_bug_assistant"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
