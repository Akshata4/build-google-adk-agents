[project]
name = "code-review-assistant"
version = "0.1.0"
description = "Production quality Python code review and fix assistant built with Google ADK"
authors = [{ name = "Akshata Madavi", email = "akshatamadavi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=2.13.0",
    "pycodestyle>=2.14.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_review_assistant"]

[dependency-groups]
dev = [
    "google-adk[eval]>=2.13",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*(Sequential|Loop)Agent is deprecated:DeprecationWarning"]
