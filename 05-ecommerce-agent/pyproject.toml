[project]
name = "sports-store-agent"
version = "0.1.0"
description = "Production quality e-commerce agent (sports store) built with Google ADK and MCP Toolbox"
authors = [{ name = "Akshata Madavi", email = "akshatamadavi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[toolbox]>=2.13.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sports_store_agent"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
